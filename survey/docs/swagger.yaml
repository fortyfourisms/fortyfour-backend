definitions:
  survey_internal_dto.APIResponse:
    properties:
      data: {}
      error:
        type: string
      errors:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      success:
        type: boolean
    type: object
  survey_internal_dto.AlasanRequest:
    properties:
      alasan:
        type: string
      responden_id:
        type: integer
      risiko_id:
        type: integer
    type: object
  survey_internal_dto.CreateRespondenRequest:
    properties:
      email:
        type: string
      id_perusahaan:
        type: string
      jabatan:
        type: string
      nama_lengkap:
        type: string
      no_telepon:
        type: string
      sertifikat_training:
        type: string
    type: object
  survey_internal_dto.DampakRequest:
    properties:
      dampak_finansial:
        $ref: '#/definitions/survey_internal_models.ImpactLevel'
      dampak_hukum:
        $ref: '#/definitions/survey_internal_models.ImpactLevel'
      dampak_operasional:
        $ref: '#/definitions/survey_internal_models.ImpactLevel'
      dampak_reputasi:
        $ref: '#/definitions/survey_internal_models.ImpactLevel'
      frekuensi:
        $ref: '#/definitions/survey_internal_models.FrequencyLevel'
      responden_id:
        type: integer
      risiko_id:
        type: integer
    type: object
  survey_internal_dto.EligibilityRequest:
    properties:
      pernah_terjadi:
        type: boolean
      responden_id:
        type: integer
      risiko_id:
        type: integer
    type: object
  survey_internal_dto.ErrorResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  survey_internal_dto.NavigateRequest:
    properties:
      current_risk:
        type: integer
      direction:
        type: string
      responden_id:
        type: integer
    type: object
  survey_internal_dto.PengendalianRequest:
    properties:
      ada_pengendalian:
        type: boolean
      deskripsi_pengendalian:
        type: string
      responden_id:
        type: integer
      risiko_id:
        type: integer
    type: object
  survey_internal_dto.ProgressResponse:
    properties:
      langkah_saat_ini:
        type: string
      responden_id:
        type: integer
      risiko_id:
        type: integer
      selesai:
        type: boolean
    type: object
  survey_internal_dto.RespondenResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      id_perusahaan:
        description: dari PERUSAHAAN
        type: string
      jabatan:
        type: string
      nama_lengkap:
        description: dari RESPONDEN
        type: string
      nama_perusahaan:
        type: string
      nama_sektor:
        type: string
      nama_sub_sektor:
        description: dari JOIN (opsional)
        type: string
      no_telepon:
        type: string
      sertifikat_training:
        type: string
      updated_at:
        type: string
      user_id:
        description: dari backend (JWT)
        type: string
    type: object
  survey_internal_models.FrequencyLevel:
    enum:
    - 1
    - 2
    - 3
    - 4
    type: integer
    x-enum-varnames:
    - FrequencySmall
    - FrequencyMedium
    - FrequencyLarge
    - FrequencyVeryLarge
  survey_internal_models.ImpactLevel:
    enum:
    - 1
    - 2
    - 3
    - 4
    type: integer
    x-enum-varnames:
    - ImpactNotSignificant
    - ImpactFairlySignificant
    - ImpactSignificant
    - ImpactVerySignificant
info:
  contact: {}
paths:
  /api/survey/finish:
    post:
      consumes:
      - application/json
      description: Complete the survey
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/survey_internal_dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
      summary: Finish Survey
      tags:
      - risiko
  /api/survey/navigate:
    post:
      consumes:
      - application/json
      description: Navigate through survey steps
      parameters:
      - description: Navigate request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/survey_internal_dto.NavigateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/survey_internal_dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/survey_internal_dto.ProgressResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
      summary: Navigate Survey
      tags:
      - risiko
  /api/survey/responden:
    get:
      description: Hanya admin yang dapat melihat semua data responden
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/survey_internal_dto.RespondenResponse'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ambil semua responden
      tags:
      - Responden (Admin)
  /api/survey/responden/{id}:
    get:
      description: Hanya admin yang dapat melihat detail responden
      parameters:
      - description: Responden ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/survey_internal_dto.RespondenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ambil responden berdasarkan ID
      tags:
      - Responden (Admin)
  /api/survey/responden/me:
    get:
      description: User hanya dapat melihat data dirinya sendiri
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/survey_internal_dto.RespondenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ambil data responden milik user login
      tags:
      - Responden (User)
    post:
      consumes:
      - application/json
      description: Jika belum ada maka create, jika sudah ada maka update (upsert)
      parameters:
      - description: Data Responden
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/survey_internal_dto.CreateRespondenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/survey_internal_dto.RespondenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create / Update responden milik user login
      tags:
      - Responden (User)
  /api/survey/risiko/{id}:
    get:
      consumes:
      - application/json
      description: Get risk data by respondent ID (admin only)
      parameters:
      - description: Respondent ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/survey_internal_dto.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
      summary: Get Risiko by Respondent ID
      tags:
      - risiko
  /api/survey/risiko/dampak:
    post:
      consumes:
      - application/json
      description: Submit impact assessment for risk
      parameters:
      - description: Dampak request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/survey_internal_dto.DampakRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/survey_internal_dto.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
      summary: Submit Dampak
      tags:
      - risiko
  /api/survey/risiko/eligibility:
    post:
      consumes:
      - application/json
      description: Submit eligibility for risk assessment
      parameters:
      - description: Eligibility request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/survey_internal_dto.EligibilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/survey_internal_dto.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
      summary: Submit Eligibility
      tags:
      - risiko
  /api/survey/risiko/pengendalian:
    post:
      consumes:
      - application/json
      description: Submit control measures for risk
      parameters:
      - description: Pengendalian request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/survey_internal_dto.PengendalianRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/survey_internal_dto.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
      summary: Submit Pengendalian
      tags:
      - risiko
  /api/survey/risiko/reason:
    post:
      consumes:
      - application/json
      description: Submit reason for risk
      parameters:
      - description: Alasan request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/survey_internal_dto.AlasanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/survey_internal_dto.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
      summary: Submit Alasan
      tags:
      - risiko
  /api/survey/save-progress:
    post:
      consumes:
      - application/json
      description: Save current survey progress
      parameters:
      - description: Save progress request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/survey_internal_dto.NavigateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/survey_internal_dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/survey_internal_dto.ProgressResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/survey_internal_dto.ErrorResponse'
      summary: Save Progress
      tags:
      - risiko
swagger: "2.0"
