basePath: /
definitions:
  dto.APIResponse:
    properties:
      data: {}
      error:
        type: string
      errors:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.AlasanRequest:
    properties:
      alasan:
        type: string
      responden_id:
        type: integer
      risiko_id:
        type: integer
    type: object
  dto.CreateRespondenRequest:
    properties:
      email:
        type: string
      id_perusahaan:
        type: string
      jabatan:
        type: string
      nama_lengkap:
        type: string
      no_telepon:
        type: string
      sertifikat_training:
        type: string
    type: object
  dto.DampakRequest:
    properties:
      dampak_finansial:
        $ref: '#/definitions/models.ImpactLevel'
      dampak_hukum:
        $ref: '#/definitions/models.ImpactLevel'
      dampak_operasional:
        $ref: '#/definitions/models.ImpactLevel'
      dampak_reputasi:
        $ref: '#/definitions/models.ImpactLevel'
      frekuensi:
        $ref: '#/definitions/models.FrequencyLevel'
      responden_id:
        type: integer
      risiko_id:
        type: integer
    type: object
  dto.EditRequestItemResponse:
    properties:
      edit_approved_at:
        type: string
      edit_approved_by:
        type: string
      edit_rejected_at:
        type: string
      edit_rejected_by:
        type: string
      edit_request_reason:
        type: string
      edit_request_response:
        type: string
      edit_requested_at:
        type: string
      nama_lengkap:
        type: string
      nama_perusahaan:
        type: string
      responden_id:
        type: integer
      status:
        type: string
      user_id:
        type: string
    type: object
  dto.EligibilityRequest:
    properties:
      pernah_terjadi:
        type: boolean
      responden_id:
        type: integer
      risiko_id:
        type: integer
    type: object
  dto.ErrorResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.NavigateRequest:
    properties:
      current_risk:
        type: integer
      direction:
        type: string
      responden_id:
        type: integer
    type: object
  dto.PengendalianRequest:
    properties:
      ada_pengendalian:
        type: boolean
      deskripsi_pengendalian:
        type: string
      responden_id:
        type: integer
      risiko_id:
        type: integer
    type: object
  dto.ProgressResponse:
    properties:
      edit_approved_at:
        type: string
      edit_approved_by:
        type: string
      edit_rejected_at:
        type: string
      edit_rejected_by:
        type: string
      edit_request_reason:
        type: string
      edit_request_response:
        type: string
      edit_requested_at:
        type: string
      is_rejected:
        type: boolean
      langkah_saat_ini:
        type: string
      responden_id:
        type: integer
      risiko_id:
        type: integer
      selesai:
        type: boolean
      status:
        type: string
      submitted_at:
        type: string
    type: object
  dto.RequestEditRequest:
    properties:
      reason:
        type: string
    type: object
  dto.RespondenResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      id_perusahaan:
        description: dari PERUSAHAAN
        type: string
      jabatan:
        type: string
      nama_lengkap:
        description: dari RESPONDEN
        type: string
      nama_perusahaan:
        type: string
      nama_sektor:
        type: string
      nama_sub_sektor:
        description: dari JOIN (opsional)
        type: string
      no_telepon:
        type: string
      sertifikat_training:
        type: string
      updated_at:
        type: string
      user_id:
        description: dari backend (JWT)
        type: string
    type: object
  dto.ReviewEditRequest:
    properties:
      action:
        description: '"approve" or "reject"'
        example: approve
        type: string
      response:
        example: Alasan persetujuan atau penolakan
        type: string
    type: object
  models.FrequencyLevel:
    enum:
    - 1
    - 2
    - 3
    - 4
    type: integer
    x-enum-varnames:
    - FrequencySmall
    - FrequencyMedium
    - FrequencyLarge
    - FrequencyVeryLarge
  models.ImpactLevel:
    enum:
    - 1
    - 2
    - 3
    - 4
    type: integer
    x-enum-varnames:
    - ImpactNotSignificant
    - ImpactFairlySignificant
    - ImpactSignificant
    - ImpactVerySignificant
host: localhost:8082
info:
  contact: {}
  description: API documentation for Survey service.
  title: Survey API
  version: "1.0"
paths:
  /api/health:
    get:
      description: Check if the Survey API is running and healthy
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - Health
  /api/survey/edit-requests:
    get:
      description: Get all pending survey edit requests (Admin/Staff only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.EditRequestItemResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get All Edit Requests (Admin)
      tags:
      - Survey Edit Request
  /api/survey/edit-requests/{id}:
    post:
      consumes:
      - application/json
      description: Approve or reject a request to edit survey data. Admin specifies
        action ("approve" or "reject").
      parameters:
      - description: Respondent ID
        in: path
        name: id
        required: true
        type: integer
      - description: Provide 'action' (approve/reject) and optional 'response' string
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ReviewEditRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProgressResponse'
              type: object
        "400":
          description: Invalid body or respondent ID
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden - Admin or Staff only
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Review Edit Request
      tags:
      - Survey Edit Request
  /api/survey/edit-requests/me:
    get:
      description: Get current user's edit request
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.EditRequestItemResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get My Edit Request (User)
      tags:
      - Survey Edit Request
  /api/survey/finish:
    post:
      description: Mark survey as completed
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Finish Survey
      tags:
      - Survey Progress
  /api/survey/navigate:
    post:
      consumes:
      - application/json
      description: Navigate to next or previous risk
      parameters:
      - description: Navigation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.NavigateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProgressResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Navigate Survey
      tags:
      - Survey Progress
  /api/survey/progress:
    get:
      description: Get current survey progress for the user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProgressResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get Survey Progress
      tags:
      - Survey Progress
  /api/survey/request-edit:
    post:
      consumes:
      - application/json
      description: Request to edit survey data
      parameters:
      - description: Edit request reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RequestEditRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProgressResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Request Edit
      tags:
      - Survey Edit Request
  /api/survey/responden:
    get:
      description: Get all survey respondents (Admin/Staff only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.RespondenResponse'
                  type: array
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get All Responden
      tags:
      - Responden
  /api/survey/responden/{id}:
    get:
      description: Get details of a specific respondent (Admin/Staff only)
      parameters:
      - description: Responden ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.RespondenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get Responden by ID
      tags:
      - Responden
  /api/survey/responden/me:
    get:
      description: Get current user's respondent profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.RespondenResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get My Responden Profile
      tags:
      - Responden
    post:
      consumes:
      - application/json
      description: Create or update current user's respondent profile
      parameters:
      - description: Respondent data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateRespondenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.RespondenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Upsert My Responden Profile
      tags:
      - Responden
  /api/survey/risiko:
    get:
      description: Get all active risks for survey
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get All Risiko Aktif
      tags:
      - Risiko
  /api/survey/risiko/{id}:
    get:
      description: Get risk assessment data for a specific respondent (Admin/Staff
        only)
      parameters:
      - description: Respondent ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get Risiko Data by Respondent ID
      tags:
      - Risiko
  /api/survey/risiko/dampak:
    post:
      consumes:
      - application/json
      description: Submit impact of risk
      parameters:
      - description: Dampak request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DampakRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Submit Dampak
      tags:
      - Risiko
  /api/survey/risiko/eligibility:
    post:
      consumes:
      - application/json
      description: Submit eligibility for risk assessment
      parameters:
      - description: Eligibility request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.EligibilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Submit Eligibility
      tags:
      - Risiko
  /api/survey/risiko/me:
    get:
      description: Get current user's risk assessment data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get My Risiko Data
      tags:
      - Risiko
  /api/survey/risiko/pengendalian:
    post:
      consumes:
      - application/json
      description: Submit mitigation/control for risk
      parameters:
      - description: Pengendalian request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PengendalianRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Submit Pengendalian
      tags:
      - Risiko
  /api/survey/risiko/reason:
    post:
      consumes:
      - application/json
      description: Submit reason for not having risk
      parameters:
      - description: Alasan request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AlasanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Submit Alasan
      tags:
      - Risiko
  /api/survey/save-progress:
    post:
      consumes:
      - application/json
      description: Save current risk progress
      parameters:
      - description: Save progress request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.NavigateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProgressResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Save Survey Progress
      tags:
      - Survey Progress
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
