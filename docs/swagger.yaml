      dampak_hukum:
        $ref: '#/definitions/models.ImpactLevel'
      dampak_operasional:
        $ref: '#/definitions/models.ImpactLevel'
      dampak_reputasi:
        $ref: '#/definitions/models.ImpactLevel'
