  fortyfour-backend_internal_dto.CsirtMiniResponse:
    properties:
      email_csirt:
        type: string
      id:
        type: string
      nama_csirt:
        type: string
      telepon_csirt:
        type: string
      web_csirt:
        type: string
    type: object
  fortyfour-backend_internal_dto.CsirtResponse:
    properties:
      email_csirt:
        type: string
      file_public_key_pgp:
        type: string
      file_rfc2350:
        type: string
      file_str:
        type: string
      id:
        type: string
      nama_csirt:
        type: string
      perusahaan:
        $ref: '#/definitions/fortyfour-backend_internal_dto.PerusahaanResponse'
