        type: string
      id_pilihan_user:
        description: jawaban yang dipilih user
        type: string
      id_soal:
        type: string
      is_correct:
        type: boolean
      pertanyaan:
        type: string
    type: object
  fortyfour-backend_internal_dto.IkasAgg:
