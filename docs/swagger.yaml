        items:
          type: string
        type: array
    required:
    - deskripsi
    - judul
    type: object
  fortyfour-backend_internal_dto.CreateEventRegistrationRequest:
    properties:
      email:
        maxLength: 255
        type: string
      jabatan:
        maxLength: 255
        minLength: 2
        type: string
      nama:
        maxLength: 255
        minLength: 3
        type: string
      no_hp:
        maxLength: 50
        minLength: 8
        type: string
      perusahaan:
        maxLength: 255
        minLength: 2
        type: string
      sektor:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - email
    - jabatan
    - nama
    - no_hp
    - perusahaan
    - sektor
    type: object
  fortyfour-backend_internal_dto.CreateEventRequest:
    properties:
      deskripsi:
        type: string
      judul:
        maxLength: 255
        minLength: 5
        type: string
      lokasi:
        type: string
      tanggal:
        example: "2024-12-31T15:00:00Z"
        type: string
    required:
    - deskripsi
    - judul
    - lokasi
    - tanggal
    type: object
  fortyfour-backend_internal_dto.CreateKelasRequest:
    properties:
      deskripsi:
        type: string
      durasi_jp:
        type: integer
      informasi_umum:
        type: string
      judul:
        maxLength: 255
        minLength: 3
        type: string
      kategori:
        type: string
      penyelenggara:
        type: string
      syarat_pendaftaran:
        type: string
      target_peserta:
        type: string
      thumbnail:
        type: string
    required:
    - judul
    type: object
  fortyfour-backend_internal_dto.CreateKuisRequest:
    properties:
      deskripsi:
        type: string
      durasi_menit:
        type: integer
      id_materi:
        description: NULL = kuis akhir
        type: string
      is_final:
        type: boolean
      judul:
        maxLength: 255
        minLength: 3
        type: string
      max_attempt:
        description: 0 = unlimited
        type: integer
      passing_grade:
        maximum: 100
        minimum: 0
        type: number
      urutan:
        minimum: 1
        type: integer
    required:
    - judul
    - passing_grade
    - urutan
    type: object
  fortyfour-backend_internal_dto.CreateMateriRequest:
    properties:
      deskripsi_singkat:
        type: string
      durasi_detik:
        type: integer
      judul:
        maxLength: 255
        minLength: 3
        type: string
      kategori:
        type: string
      konten_html:
        type: string
      tipe:
        enum:
        - video
        - teks
        type: string
      urutan:
        minimum: 1
        type: integer
      youtube_id:
        type: string
    required:
    - judul
    - tipe
    - urutan
    type: object
  fortyfour-backend_internal_dto.CreatePICRequest:
    properties:
      email:
        type: string
      id_perusahaan:
        type: string
      nama:
        type: string
      telepon:
        type: string
    type: object
  fortyfour-backend_internal_dto.CreatePerusahaanRequest:
    properties:
      alamat:
        type: string
      email:
        type: string
      id_sub_sektor:
        type: string
      nama_perusahaan:
        type: string
      photo:
        type: string
      telepon:
        type: string
      website:
        type: string
    type: object
  fortyfour-backend_internal_dto.CreatePilihanRequest:
    properties:
      is_correct:
        type: boolean
      teks:
        type: string
      urutan:
        minimum: 1
        type: integer
    required:
    - teks
    - urutan
    type: object
  fortyfour-backend_internal_dto.CreateRoleRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - name
    type: object
  fortyfour-backend_internal_dto.CreateSEEditRequestDTO:
    properties:
      catatan:
        description: alasan user
        type: string
      catatan_user:
        description: alias dari frontend
        type: string
      data_perubahan:
        $ref: '#/definitions/fortyfour-backend_internal_dto.UpdateSERequest'
    required:
    - data_perubahan
    type: object
  fortyfour-backend_internal_dto.CreateSERequest:
    properties:
      anggaran_operasional:
        enum:
        - A
        - B
        - C
        type: string
      as_number_se:
        type: string
      dampak_kegagalan:
        enum:
        - A
        - B
        - C
        type: string
      data_pribadi:
        enum:
        - A
        - B
        - C
        type: string
      fitur_se:
        type: string
      id_perusahaan:
        type: string
      id_sub_sektor:
        type: string
      ip_se:
        type: string
      jumlah_pengguna:
        enum:
        - A
        - B
        - C
        type: string
      kekritisan_proses:
        enum:
        - A
        - B
        - C
        type: string
      kepatuhan_peraturan:
        enum:
        - A
        - B
        - C
        type: string
      klasifikasi_data:
        enum:
        - A
        - B
        - C
        type: string
      nama_se:
        description: Informasi SE
        type: string
      nilai_investasi:
        description: Karakteristik Instansi (A/B/C)
        enum:
        - A
        - B
        - C
        type: string
      pengelola_se:
        type: string
      potensi_kerugian_dan_dampak_negatif:
        enum:
        - A
        - B
        - C
        type: string
      teknik_kriptografi:
        enum:
        - A
        - B
        - C
        type: string
    required:
    - anggaran_operasional
    - as_number_se
    - dampak_kegagalan
    - data_pribadi
    - id_perusahaan
    - ip_se
    - jumlah_pengguna
    - kekritisan_proses
    - kepatuhan_peraturan
    - klasifikasi_data
    - nama_se
    - nilai_investasi
    - pengelola_se
    - potensi_kerugian_dan_dampak_negatif
    - teknik_kriptografi
    type: object
  fortyfour-backend_internal_dto.CreateSdmCsirtRequest:
    properties:
      id_csirt:
        type: string
      jabatan_csirt:
        type: string
      jabatan_perusahaan:
        type: string
      nama_personel:
        type: string
      sertifikasi:
        type: string
      skill:
        type: string
    type: object
  fortyfour-backend_internal_dto.CreateSoalRequest:
    properties:
      pertanyaan:
        type: string
      pilihan:
        items:
          $ref: '#/definitions/fortyfour-backend_internal_dto.CreatePilihanRequest'
        maxItems: 5
        minItems: 2
        type: array
      urutan:
        minimum: 1
        type: integer
    required:
    - pertanyaan
    - pilihan
    - urutan
    type: object
  fortyfour-backend_internal_dto.CreateUserRequest:
    properties:
      email:
        type: string
      jabatan:
        type: string
      password:
        minLength: 8
        type: string
      role_id:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
