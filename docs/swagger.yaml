  version: "1.0"
paths:
  /api/aktivitas:
    get:
      description: Mengambil data aktivitas per perusahaan
      parameters:
      - description: Perusahaan ID
        in: query
        name: perusahaan_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/fortyfour-backend_internal_utils.JSONResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/fortyfour-backend_internal_dto.AktivitasResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fortyfour-backend_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List aktivitas berdasarkan Perusahaan ID
      tags:
      - Aktivitas
    post:
      consumes:
      - application/json
      description: Membuat record aktivitas baru
      parameters:
      - description: Data aktivitas
        in: body
        name: aktivitas
        required: true
        schema:
          $ref: '#/definitions/fortyfour-backend_internal_dto.CreateAktivitasRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/fortyfour-backend_internal_utils.JSONResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fortyfour-backend_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Tambah aktivitas baru
      tags:
      - Aktivitas
  /api/aktivitas/{id}:
    delete:
      description: Menghapus data aktivitas berdasarkan ID
      parameters:
      - description: Aktivitas ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fortyfour-backend_internal_utils.JSONResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fortyfour-backend_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Hapus aktivitas
      tags:
      - Aktivitas
    get:
      description: Mengambil satu data aktivitas
      parameters:
      - description: Aktivitas ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
