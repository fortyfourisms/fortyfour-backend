        type: integer
      risiko_id:
        type: integer
    type: object
  dto.NavigateRequest:
    properties:
      current_risk:
        type: integer
      direction:
        type: string
      responden_id:
        type: integer
    type: object
  dto.PengendalianRequest:
    properties:
      ada_pengendalian:
        type: boolean
      custom_risiko_id:
        type: integer
      deskripsi_pengendalian:
        type: string
      responden_id:
        type: integer
      risiko_id:
        type: integer
    type: object
  dto.RespondenResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      id_perusahaan:
        description: dari PERUSAHAAN
        type: string
      jabatan:
        type: string
      nama_lengkap:
        description: dari RESPONDEN
        type: string
      nama_perusahaan:
        type: string
      nama_sektor:
        type: string
      nama_sub_sektor:
        description: dari SUB SEKTOR & SEKTOR (hasil JOIN)
        type: string
      no_telepon:
        type: string
      sertifikat_training:
        type: string
      updated_at:
        type: string
    type: object
  dto.UpdateRespondenRequest:
    properties:
      email:
        type: string
      id_perusahaan:
        type: string
      jabatan:
        type: string
      nama_lengkap:
        type: string
      no_telepon:
        type: string
      sertifikat_training:
        type: string
    type: object
  fortyfour-backend_internal_dto.AddPolicyRequest:
    properties:
      action:
        type: string
      resource:
        type: string
      role:
        type: string
    required:
    - action
    - resource
    - role
    type: object
  fortyfour-backend_internal_dto.AktivitasResponse:
    properties:
      created_at:
        type: string
      deskripsi:
        type: string
      id:
        type: integer
      jenis_aktivitas:
        items:
          type: string
        type: array
      judul:
        type: string
      perusahaan_id:
        type: string
      tanggal_mulai:
        type: string
      tanggal_selesai:
        type: string
      updated_at:
        type: string
    type: object
  fortyfour-backend_internal_dto.AuthResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      message:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/fortyfour-backend_internal_models.User'
    type: object
  fortyfour-backend_internal_dto.BeritaAuthor:
    properties:
      display_name:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
  fortyfour-backend_internal_dto.BeritaResponse:
    properties:
      author:
        $ref: '#/definitions/fortyfour-backend_internal_dto.BeritaAuthor'
      author_id:
        type: string
      created_at:
        type: string
      deskripsi:
        type: string
      id:
        type: integer
      judul:
        type: string
      tags:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  fortyfour-backend_internal_dto.BulkAddPolicyRequest:
    properties:
      policies:
        items:
          $ref: '#/definitions/fortyfour-backend_internal_dto.PolicyDefinition'
        type: array
      role:
        type: string
    required:
    - policies
    - role
    type: object
  fortyfour-backend_internal_dto.ChatRequest:
    properties:
      message:
        type: string
      session_id:
        type: string
    type: object
  fortyfour-backend_internal_dto.CreateAktivitasRequest:
    properties:
      deskripsi:
        type: string
      jenis_aktivitas:
        items:
          type: string
        type: array
      judul:
        type: string
      perusahaan_id:
        type: string
      tanggal_mulai:
        type: string
      tanggal_selesai:
        type: string
    type: object
  fortyfour-backend_internal_dto.CreateBeritaRequest:
    properties:
      deskripsi:
        type: string
      judul:
        maxLength: 255
        minLength: 5
