host: localhost:8080
info:
  contact: {}
  description: API documentation for Fortyfour Backend - main auth and management
    service.
  title: Fortyfour Backend API
  version: "1.0"
paths:
  /api/aktivitas:
    get:
      description: Mengambil seluruh data aktivitas. Jika query `perusahaan_id` dikirim,
        hasil akan difilter berdasarkan perusahaan.
      parameters:
      - description: Perusahaan ID untuk filter aktivitas
        in: query
        name: perusahaan_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/fortyfour-backend_internal_utils.JSONResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/fortyfour-backend_internal_dto.AktivitasResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fortyfour-backend_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List semua aktivitas
      tags:
      - Aktivitas
    post:
      consumes:
      - application/json
      description: Membuat record aktivitas baru
      parameters:
      - description: Data aktivitas
        in: body
        name: aktivitas
        required: true
        schema:
          $ref: '#/definitions/fortyfour-backend_internal_dto.CreateAktivitasRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/fortyfour-backend_internal_utils.JSONResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fortyfour-backend_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Tambah aktivitas baru
      tags:
      - Aktivitas
  /api/aktivitas/{id}:
    delete:
      description: Menghapus data aktivitas berdasarkan ID
      parameters:
      - description: Aktivitas ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fortyfour-backend_internal_utils.JSONResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fortyfour-backend_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Hapus aktivitas
      tags:
      - Aktivitas
    get:
      description: Mengambil satu data aktivitas
      parameters:
      - description: Aktivitas ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/fortyfour-backend_internal_utils.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/fortyfour-backend_internal_dto.AktivitasResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fortyfour-backend_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ambil aktivitas berdasarkan ID
      tags:
      - Aktivitas
    put:
      consumes:
      - application/json
      description: Mengubah data aktivitas berdasarkan ID
      parameters:
      - description: Aktivitas ID
        in: path
        name: id
        required: true
        type: integer
      - description: Data update
        in: body
        name: aktivitas
        required: true
        schema:
          $ref: '#/definitions/fortyfour-backend_internal_dto.UpdateAktivitasRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fortyfour-backend_internal_utils.JSONResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fortyfour-backend_internal_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fortyfour-backend_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update aktivitas
      tags:
      - Aktivitas
  /api/aktivitas/jenis:
    get:
      description: Mengambil daftar jenis aktivitas yang diperbolehkan (untuk dropdown)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/fortyfour-backend_internal_utils.JSONResponse'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
      summary: List jenis aktivitas
      tags:
      - Aktivitas
  /api/berita:
