      avg_nilai_kematangan:
        type: number
      avg_target_nilai:
        type: number
      total_ikas:
        type: integer
    type: object
  fortyfour-backend_internal_dto.IkasStatusCount:
    properties:
      belum_mengisi_ikas:
        type: integer
      sudah_mengisi_ikas:
        type: integer
      total_perusahaan:
        type: integer
    type: object
  fortyfour-backend_internal_dto.JawabanItem:
    properties:
      id_pilihan:
        type: string
      id_soal:
        type: string
    required:
    - id_pilihan
    - id_soal
    type: object
  fortyfour-backend_internal_dto.KelasProgress:
    properties:
      is_kelas_selesai:
        type: boolean
      kuis_akhir_lulus:
        type: boolean
      kuis_lulus:
        type: integer
      materi_selesai:
        type: integer
      persentase_progress:
        type: number
      total_kuis:
        type: integer
      total_materi:
        type: integer
    type: object
  fortyfour-backend_internal_dto.KelasResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      deskripsi:
        type: string
      durasi_jp:
        type: integer
      id:
        type: string
      informasi_umum:
        type: string
      judul:
        type: string
      kategori:
        type: string
      kuis_list:
        items:
          $ref: '#/definitions/fortyfour-backend_internal_dto.KuisResponse'
        type: array
      materi:
        description: Disertakan saat GET detail
        items:
          $ref: '#/definitions/fortyfour-backend_internal_dto.MateriResponse'
        type: array
      penyelenggara:
        type: string
      progress:
        allOf:
        - $ref: '#/definitions/fortyfour-backend_internal_dto.KelasProgress'
        description: progress user saat ini
      sertifikat:
        $ref: '#/definitions/fortyfour-backend_internal_dto.SertifikatResponse'
      status:
        $ref: '#/definitions/fortyfour-backend_internal_models.KelasStatus'
      syarat_pendaftaran:
        type: string
      target_peserta:
        type: string
      thumbnail:
        type: string
      updated_at:
        type: string
    type: object
  fortyfour-backend_internal_dto.KonversiResponse:
    properties:
      nama_perusahaan:
        type: string
      persentase:
        description: (TotalPoin / 4) * 100
        type: number
      perusahaan_id:
        type: string
      poin_csirt:
        description: 1 jika ada, 0 jika tidak
        type: integer
      poin_ikas:
        description: 1 jika ada, 0 jika tidak
        type: integer
      poin_kse:
        description: 1 jika ada, 0 jika tidak
        type: integer
      poin_survey:
        description: 1 jika ada, 0 jika tidak
        type: integer
      total_poin:
        description: Sum dari semua poin (max 4)
        type: integer
    type: object
  fortyfour-backend_internal_dto.KuisResponse:
    properties:
      attempt_count:
        type: integer
      created_at:
        type: string
      deskripsi:
        type: string
      durasi_menit:
        type: integer
      id:
        type: string
      id_kelas:
        type: string
      id_materi:
        type: string
      is_final:
        type: boolean
      is_passed:
        description: Progress user per kuis (diisi saat GET /api/kelas/{id}/kuis jika
          user login)
        type: boolean
      judul:
        type: string
      last_attempt_id:
        type: string
      latest_score:
        type: number
      max_attempt:
        type: integer
      passed_at:
        type: string
      passing_grade:
        type: number
      soal:
        description: Nested — hanya admin GET detail
        items:
          $ref: '#/definitions/fortyfour-backend_internal_dto.SoalResponse'
        type: array
      updated_at:
        type: string
      urutan:
        type: integer
    type: object
  fortyfour-backend_internal_dto.KuisResultResponse:
    properties:
      attempt_id:
        type: string
      detail:
        items:
          $ref: '#/definitions/fortyfour-backend_internal_dto.HasilSoalResponse'
        type: array
      finished_at:
        type: string
      is_passed:
        type: boolean
      skor:
        type: number
      total_benar:
        type: integer
      total_soal:
        type: integer
    type: object
  fortyfour-backend_internal_dto.LoginRequest:
    properties:
      cf-turnstile-response:
        type: string
      identifier:
        type: string
      password:
        type: string
    required:
    - cf-turnstile-response
    - identifier
    - password
    type: object
  fortyfour-backend_internal_dto.MateriResponse:
    properties:
      created_at:
        type: string
      deskripsi_singkat:
        type: string
      durasi_detik:
        type: integer
      file_pendukung:
        description: Nested data (opsional, disertakan saat GET detail)
        items:
          $ref: '#/definitions/fortyfour-backend_internal_dto.FilePendukungResponse'
        type: array
      id:
        type: string
      id_kelas:
        type: string
      is_completed:
        description: Progress user untuk materi ini
        type: boolean
      judul:
        type: string
      kategori:
        type: string
      konten_html:
        type: string
