  fortyfour-backend_internal_dto.FeedbackResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      id_materi:
        type: string
      konten:
        type: string
      updated_at:
        type: string
    type: object
  fortyfour-backend_internal_dto.FilePendukungResponse:
