basePath: /
definitions:
  dto.AlasanRequest:
    properties:
      alasan:
        type: string
      custom_risiko_id:
        type: integer
      responden_id:
        type: integer
      risiko_id:
        type: integer
    type: object
  dto.CreateRespondenRequest:
    properties:
      email:
        type: string
      id_perusahaan:
        type: string
      jabatan:
        type: string
      nama_lengkap:
        type: string
      no_telepon:
        type: string
      sertifikat_training:
        type: string
    type: object
  dto.CustomRisikoRequest:
