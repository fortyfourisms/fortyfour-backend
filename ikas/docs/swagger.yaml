host: localhost:8081
info:
  contact: {}
  description: API documentation for IKAS (Indeks Kematangan Keamanan Siber) service.
  title: IKAS API
  version: "1.0"
paths:
  /api/deteksi:
    get:
      description: Mengambil seluruh data deteksi
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ikas_internal_dto.DeteksiResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ikas_internal_dto.ErrorResponse'
      summary: List semua deteksi
      tags:
      - Deteksi
  /api/deteksi/{id}:
    get:
      parameters:
      - description: Deteksi ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ikas_internal_dto.DeteksiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ikas_internal_dto.ErrorResponse'
      summary: Ambil deteksi berdasarkan ID
      tags:
      - Deteksi
  /api/gulih:
    get:
      description: Mengambil seluruh data gulih
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ikas_internal_dto.GulihResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ikas_internal_dto.ErrorResponse'
      summary: List semua gulih
      tags:
      - Gulih
  /api/gulih/{id}:
    get:
      parameters:
      - description: Gulih ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ikas_internal_dto.GulihResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ikas_internal_dto.ErrorResponse'
      summary: Ambil gulih berdasarkan ID
      tags:
      - Gulih
  /api/health:
    get:
      description: Check if the API is running and healthy
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - Health
  /api/identifikasi:
    get:
      description: Mengambil seluruh data identifikasi
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
